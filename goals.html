<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriTrack | Goals</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <nav class="sidebar">
        <div class="logo">🌿 NutriTrack</div>
        <div class="nav-links">
            <a href="index.html">🏠 Dashboard</a>
            <a href="meals.html">🍽 Meals</a>
            <a href="summary.html">📊 Summary</a>
            <a href="goals.html">🎯 Goals</a>
            <a href="progress.html">📈 Progress</a>
            <a href="#" class="logout" onclick="logout()">🚪 Sign Out</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="page-header">
            <h1>Weight Goals</h1>
        </div>

        <div class="metrics-row">
            <div class="metric-card">
                <h3>Start Weight</h3>
                <p id="startWeight">0 kg</p>
            </div>
            <div class="metric-card">
                <h3>Current Weight</h3>
                <p id="currentWeight">0 kg</p>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <div class="card-header">
                    <h2>Log Daily Weight</h2>
                </div>
                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" step="0.1" id="newWeight" class="form-control" placeholder="Enter today's weight">
                </div>
                <button class="btn" onclick="logWeight()">Save Log</button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>History Log</h2>
                </div>
                <div style="max-height: 250px; overflow-y:auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Recorded Weight</th>
                            </tr>
                        </thead>
                        <tbody id="weightHistory">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
