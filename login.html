<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriTrack | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="justify-content: center;">
    
    <div class="auth-container">
        <h2>🌿 NutriTrack</h2>
        <p style="text-align:center; color:var(--text-light); margin-bottom:30px;">Your Professional Health Tracker</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" class="form-control" required placeholder="Enter your name">
            </div>
            
            <div class="form-group">
                <label>Age</label>
                <input type="number" id="age" class="form-control" required placeholder="Years">
            </div>

            <div class="form-group">
                <label>Height (cm)</label>
                <input type="number" id="height" class="form-control" required placeholder="e.g. 175">
            </div>

            <div class="form-group">
                <label>Weight (kg)</label>
                <input type="number" id="weight" step="0.1" class="form-control" required placeholder="e.g. 70">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select id="gender" class="form-control" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <button type="submit" class="btn">Enter Dashboard</button>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
