<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriTrack | Meals</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <nav class="sidebar">
        <div class="logo">🌿 NutriTrack</div>
        <div class="nav-links">
            <a href="index.html">🏠 Dashboard</a>
            <a href="meals.html">🍽 Meals</a>
            <a href="summary.html">📊 Summary</a>
            <a href="goals.html">🎯 Goals</a>
            <a href="progress.html">📈 Progress</a>
            <a href="#" class="logout" onclick="logout()">🚪 Sign Out</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="page-header">
            <h1>Meal Logging</h1>
        </div>

        <div class="tabs">
            <div class="tab-btn active" data-tab="breakfast">🍳 Breakfast</div>
            <div class="tab-btn" data-tab="lunch">🍛 Lunch</div>
            <div class="tab-btn" data-tab="dinner">🍽 Dinner</div>
            <div class="tab-btn" data-tab="snacks">🍪 Snacks</div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <div class="card-header">
                    <h2>Add Food</h2>
                </div>
                
                <div class="search-container">
                    <input type="text" class="form-control" id="searchFood" placeholder="🔍 Search food database...">
                    <div class="search-results" id="searchResults"></div>
                </div>

                <div class="ai-upload" onclick="simulateAIUpload()">
                    📸 AI Upload (Simulated)<br>
                    <span style="font-size:12px; color:var(--text-light)">Click to detect food from image</span>
                </div>

                <button class="btn" style="background:#f1c40f; color:#2c3e50; margin-bottom: 20px;" onclick="showManualEntry()">✍️ Manual Entry</button>

                <!-- Entry Form (Hidden by default) -->
                <div id="mealEntryForm" class="meal-entry-form">
                    <h3 id="selectedFoodName" style="margin-bottom:15px; color:var(--primary)">Food Name</h3>
                    <div class="form-group">
                        <label>Weight (grams)</label>
                        <input type="number" id="foodWeight" class="form-control" value="100">
                    </div>
                    <button class="btn" onclick="addMealEntry()">Add to Meal</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Current Meal</h2>
                </div>
                <div id="currentMealList" class="food-list">
                    <!-- Meal items populated via JS -->
                </div>
            </div>
        </div>
    </main>

    <script src="data/foods.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
